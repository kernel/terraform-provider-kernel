name: Release preparation

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  prepare:
    name: Prepare release artifacts
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Check release preconditions
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          test -s LICENSE

          if [[ ! "$GITHUB_REF_NAME" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "Release tags must use stable semantic version format vMAJOR.MINOR.PATCH." >&2
            exit 1
          fi

          visibility="$(gh api "repos/${GITHUB_REPOSITORY}" --jq .visibility)"
          if [ "$visibility" != "public" ]; then
            echo "The provider repository must be public before a registry release." >&2
            exit 1
          fi

          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "Release tags must point to commits reachable from origin/main." >&2
            exit 1
          fi

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Build unsigned release artifacts
        uses: goreleaser/goreleaser-action@5daf1e915a5f0af01ddbcd89a43b8061ff4f1a89 # v7.2.2
        with:
          distribution: goreleaser
          version: v2.17.0
          args: release --clean --skip=publish,sign
        env:
          GORELEASER_CURRENT_TAG: ${{ github.ref_name }}

      - name: Verify release artifacts
        run: |
          version="${GITHUB_REF_NAME#v}"
          cp terraform-registry-manifest.json "dist/terraform-provider-kernel_${version}_manifest.json"
          bash scripts/check-release-artifacts.sh "$version"

      - name: Upload release artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-${{ github.ref_name }}-${{ github.run_id }}
          path: |
            dist/*.zip
            dist/*_manifest.json
            dist/*_SHA256SUMS
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
          overwrite: true
