name: Release preparation

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  prepare:
    name: Prepare release artifacts
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Check release preconditions
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          test -s LICENSE || {
            echo "LICENSE must exist before a public provider release." >&2
            exit 1
          }

          visibility="$(gh api "repos/${GITHUB_REPOSITORY}" --jq .visibility)"
          if [ "$visibility" != "public" ]; then
            echo "The provider repository must be public before a registry release." >&2
            exit 1
          fi

          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "Release tags must point to commits reachable from origin/main." >&2
            exit 1
          fi

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Build release artifacts
        uses: goreleaser/goreleaser-action@5daf1e915a5f0af01ddbcd89a43b8061ff4f1a89 # v7.2.2
        with:
          distribution: goreleaser
          version: v2.17.0
          args: release --clean --skip=publish

      - name: Verify release artifacts
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          version="${RELEASE_TAG#v}"
          cp terraform-registry-manifest.json "dist/terraform-provider-kernel_${version}_manifest.json"

          checksum="dist/terraform-provider-kernel_${version}_SHA256SUMS"
          test -s "$checksum"
          (cd dist && sha256sum --check "$(basename "$checksum")")

          expected_assets="$(
            printf '%s\n' \
              "terraform-provider-kernel_${version}_darwin_amd64.zip" \
              "terraform-provider-kernel_${version}_darwin_arm64.zip" \
              "terraform-provider-kernel_${version}_freebsd_386.zip" \
              "terraform-provider-kernel_${version}_freebsd_amd64.zip" \
              "terraform-provider-kernel_${version}_freebsd_arm.zip" \
              "terraform-provider-kernel_${version}_freebsd_arm64.zip" \
              "terraform-provider-kernel_${version}_linux_386.zip" \
              "terraform-provider-kernel_${version}_linux_amd64.zip" \
              "terraform-provider-kernel_${version}_linux_arm.zip" \
              "terraform-provider-kernel_${version}_linux_arm64.zip" \
              "terraform-provider-kernel_${version}_manifest.json" \
              "terraform-provider-kernel_${version}_windows_386.zip" \
              "terraform-provider-kernel_${version}_windows_amd64.zip" \
              "terraform-provider-kernel_${version}_windows_arm64.zip"
          )"
          actual_assets="$(awk 'NF == 2 { print $2 }' "$checksum" | sort)"
          diff -u <(printf '%s\n' "$expected_assets") <(printf '%s\n' "$actual_assets")

          for archive in dist/*.zip; do
            files="$(unzip -Z1 "$archive")"
            case "$(basename "$archive")" in
              *_windows_*) expected_binary="terraform-provider-kernel_v${version}.exe" ;;
              *) expected_binary="terraform-provider-kernel_v${version}" ;;
            esac
            if [ "$files" != "$expected_binary" ]; then
              echo "$archive contains unexpected file: $files" >&2
              exit 1
            fi
          done

      - name: Upload release artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-${{ github.ref_name }}-${{ github.run_id }}
          path: |
            dist/*.zip
            dist/*_manifest.json
            dist/*_SHA256SUMS
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
          overwrite: true
