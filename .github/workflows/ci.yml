name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    name: Go and docs
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: "1.15.5"
          terraform_wrapper: false

      - name: Check Go formatting
        run: |
          files="$(gofmt -l cmd internal)"
          if [ -n "$files" ]; then
            echo "$files"
            exit 1
          fi

      - name: Check Terraform examples
        run: terraform fmt -check -recursive examples

      - name: Check Markdown links
        run: bash scripts/check-markdown-links.sh

      - name: Validate Terraform examples
        run: bash scripts/check-examples.sh

      - name: Test
        run: go test -short -timeout=2m ./...

      - name: Vet
        run: go vet ./...

      - name: Check generated docs
        run: bash scripts/check-docs.sh
